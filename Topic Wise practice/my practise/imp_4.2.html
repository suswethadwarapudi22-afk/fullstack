<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Div</title>
</head>

<body>

    <h2>Dynamic Element</h2>

    <script>
        let div = document.createElement("div");

        div.textContent = "This div was created dynamically using JavaScript.";

        document.body.appendChild(div);
    </script>

</body>
</html>
