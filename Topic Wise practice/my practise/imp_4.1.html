<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Class</title>
</head>

<body>

    <h2>Car Details</h2>

    <script>
        class Car {
            constructor(brand, model) {
                this.brand = brand;
                this.model = model;
            }

            displayDetails() {
                document.write("Brand: " + this.brand + "<br>");
                document.write("Model: " + this.model);
            }
        }

        let car1 = new Car("Toyota", "Camry");

        car1.displayDetails();
    </script>

</body>
</html>
