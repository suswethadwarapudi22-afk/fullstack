<!DOCTYPE html>
<html>
<head>
    <title>Colours Array</title>
</head>

<body>

    <h2>Five Colours</h2>

    <script>
        let colours = ["Red", "Blue", "Green", "Yellow", "Pink"];

        for (let i = 0; i < colours.length; i++) {
            document.write(
                "<span style='color:" + colours[i] + ";'>" 
                + colours[i] + 
                "</span><br>"
            );
        }
    </script>

</body>
</html>
